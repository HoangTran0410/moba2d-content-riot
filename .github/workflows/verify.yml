name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # No lockfile is committed (see .gitignore) and @moba2d/core is a git
      # dependency, not a registry one, so this is a plain install rather
      # than `npm ci`.
      - run: npm install
      - run: npm run verify
